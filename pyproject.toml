[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-zero-dashboard"
version = "0.1.0"
description = "Vision Zero data engineering pipeline"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.dependencies]
dependencies = [
    "psycopg[binary]>=3.3",
    "geopandas>=1.1",
    "fiona>=1.10",
    "pyogrio>=0.12",
    "pyproj>=3.7",
    "shapely>=2.1",
    "pandas>=2.3",
    "numpy>=2.3",
    "tqdm>=4.67",
    "requests>=2.32",
    "python-dotenv>=1.2",
    "click>=8.3",
    "python-dateutil>=2.9",
    "pytz>=2025.2",
    "boto3>=1.43.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-mock>=3.15",
]